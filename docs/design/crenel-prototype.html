<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crenel — prototype</title>
<!--
  Crenel: clickable prototype of the whole app.

  HOW IT WORKS
  - The left area is the Mac screen: menu bar, notch, and the desktop/onboarding window.
    Hover the notch to open it, move away to close it. The pin button keeps it open.
  - The menu on the right jumps to every screen and state. "Flows" plays a whole
    scenario (meeting → recording → processing → detail).
  - [ and ] step through the states one by one.

  EDITING
  - Every screen is a <template id="tpl-…">. Inside a template:
      data-only="state-id other-id prefix*" → shown only in those states
      data-not="…"                          → hidden in those states
      data-go="state-id"                    → click goes to that state (prototype link)
      data-menu="menu-…"                    → right-click opens that menu
      data-toast="text"                     → click shows a short notice
      data-include="tpl-…"                  → pastes another template there
  - The state list (name, note, which template, where hover goes) is in the
    STATES block at the bottom of the file.
  - Colours: tailwind.config. Shared components: the <style type="text/tailwindcss"> block.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui'] },
      colors: {
        ink: { 1: '#f2f2f2', 2: '#a8a8a8', 3: '#737373', 4: '#4d4d4d' },
        signal: '#ffb340', // waiting for you
        live: '#ff4d4d',   // live / error
        ok: '#6bd194',     // ready / connected
      },
    } },
  }
</script>
<style>
  @property --rt { syntax: '<length>'; inherits: true; initial-value: 6px; }
  @property --rb { syntax: '<length>'; inherits: true; initial-value: 10px; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .breathe { animation: breathe 1.8s ease-in-out infinite; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #menu ::-webkit-scrollbar { width: 6px; }
  #menu ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
</style>
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-[#111113] text-ink-1 font-sans antialiased overflow-hidden; font-variant-numeric: tabular-nums; }
    button { @apply cursor-default; }
    [data-go], [data-toast], [data-action], [data-open], [data-mark], .select, .toggle { cursor: default; }
  }
  @layer components {
    .t-title { font-size: 15px; font-weight: 600; line-height: 1.25; }
    .t-body { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
    .t-label { font-size: 12.5px; font-weight: 500; line-height: 1.3; }
    .t-meta { font-size: 12px; font-weight: 400; line-height: 1.3; }
    .t-value { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
    .t-display { font-size: 22px; font-weight: 600; line-height: 1.1; }
    .s-hover { background: rgba(255,255,255,.06); }
    .s-selected { background: rgba(255,255,255,.10); }
    .s-track { background: rgba(255,255,255,.09); }
    .s-faint { background: rgba(255,255,255,.035); }
    .ico { width: 14px; height: 14px; flex: none; }
    .ico-s { width: 12px; height: 12px; flex: none; }
    .ico-xs { width: 11px; height: 11px; flex: none; }
    .hv { @apply transition-colors duration-150; }
    .hv:hover { background: rgba(255,255,255,.06); }

    /* Rows: text 10 inside the hover fill; heights never change */
    .row { @apply flex items-start gap-3 px-[10px] rounded-[9px] h-12 pt-[7px] hv; }
    .row-1 { @apply flex items-center gap-3 px-[10px] rounded-[9px] h-12; }
    .row-34 { @apply flex items-center gap-3 px-[10px] h-[34px]; }
    .row-38 { @apply flex items-center gap-3 px-[10px] rounded-[9px] h-[38px] hv; }
    .group-h { @apply t-label text-ink-3 px-[10px] h-[22px] flex items-end mb-1; }
    .l1 { @apply flex items-baseline gap-3; }
    .l2 { @apply flex gap-2 t-meta text-ink-3; }

    /* Buttons */
    .btn { @apply inline-flex items-center justify-center gap-1.5 h-7 px-3 rounded-[7px] t-label whitespace-nowrap transition-colors duration-150; }
    .btn-primary { @apply btn bg-ink-1 text-black hover:bg-white active:bg-ink-2; }
    .btn-ghost { @apply btn text-ink-2 hover:text-ink-1 hover:bg-white/[.06] active:bg-white/[.12]; }
    .btn-red { @apply btn text-live hover:bg-white/[.06]; }
    .btn-icon { @apply inline-flex items-center justify-center w-7 h-7 rounded-[7px] text-ink-3 hover:text-ink-1 hover:bg-white/[.06] transition-colors; }
    .btn-iconf { @apply inline-flex items-center justify-center w-7 h-7 rounded-[7px] text-ink-1 bg-white/[.06] hover:bg-white/[.10] transition-colors; }
    .dis { @apply opacity-40 pointer-events-none; }

    /* Tabs and chips */
    .tabs { @apply inline-flex gap-0.5 p-0.5 rounded-full s-faint; }
    .tab { @apply inline-flex items-center gap-[7px] h-[26px] px-3 rounded-full t-label text-ink-3 transition-colors hover:text-ink-2; }
    .tab.on { @apply text-ink-1 s-selected; }
    .tab .badge { @apply t-meta text-ink-4; }
    .tab.on .badge { @apply text-ink-2; }
    .chip { @apply inline-flex items-center gap-[5px] h-[22px] px-2 rounded-full t-meta s-selected; }
    .chip-out { @apply inline-flex items-center gap-[5px] h-[22px] px-2 rounded-full t-meta text-ink-3 border border-white/[.09] hover:text-ink-2; }
    .pill { @apply inline-flex items-center gap-1.5 h-[26px] px-2.5 rounded-full t-label text-ink-2 hover:bg-white/[.06]; }
    .pill.on { @apply s-selected text-ink-1; }

    /* Meters */
    .seg { @apply flex gap-[2px] w-full; }
    .seg > i { @apply flex-1 h-[3px] rounded-full s-track block; }
    .seg.h4 > i { @apply h-1; }
    .seg > i.f { background: currentColor; }
    .steps { @apply inline-flex gap-[3px] items-center; }
    .steps > i { @apply block w-1 h-1 rounded-full s-track transition-all duration-300; }
    .steps > i.done { @apply bg-ink-2; }
    .steps > i.cur { @apply w-3 bg-ink-1; }
    .bars { @apply inline-flex items-center gap-[2px] h-[14px]; }
    .bars > i { @apply block w-[2.5px] rounded-full bg-current transition-[height] duration-100; }

    /* Notch */
    #nwrap { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 30; --rt: 6px; --rb: 10px; transition: --rt .4s, --rb .4s; }
    #nwrap.open { --rt: 12px; --rb: 20px; }
    #nwrap::before, #nwrap::after { content: ''; position: absolute; top: 0; width: var(--rt); height: var(--rt); }
    #nwrap::before { left: calc(-1 * var(--rt)); background: radial-gradient(circle at 0 100%, transparent calc(var(--rt) - .5px), #000 var(--rt)); }
    #nwrap::after { right: calc(-1 * var(--rt)); background: radial-gradient(circle at 100% 100%, transparent calc(var(--rt) - .5px), #000 var(--rt)); }
    #notch { position: relative; background: #000; overflow: hidden; border-radius: 0 0 var(--rb) var(--rb); width: 186px; height: 32px;
      transition: width .5s cubic-bezier(.3,1.18,.4,1), height .5s cubic-bezier(.3,1.18,.4,1); }
    #nc { position: absolute; top: 0; left: 50%; transform: translateX(-50%); transition: opacity .2s ease-out; }
    #nc.open { width: 466px; padding: 40px 8px 12px; overflow-y: auto; }
    #nc.closed { width: max-content; height: 32px; }
    .ears { display: grid; width: max-content; grid-template-columns: 1fr 186px 1fr; height: 32px; align-items: center; }
    .ears > .ear { @apply flex items-center justify-center gap-[7px] px-4 whitespace-nowrap t-label; }

    /* Windows */
    .win { @apply relative rounded-[12px] overflow-hidden border border-white/10; background: #0f0f0f; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
    .lights { @apply absolute top-3.5 left-3.5 flex gap-2 z-10; }
    .lights > i { @apply block w-3 h-3 rounded-full bg-white/15; }
    .lights > i:first-child { @apply bg-[#ff5f57]; }
    .sidebar { @apply w-[206px] flex-none flex flex-col gap-6 px-3 pb-4; background: #0a0a0a; }
    .sb-item { @apply flex items-center gap-3 h-9 px-[10px] rounded-[9px] t-label text-ink-2 hv; }
    .sb-item svg { @apply text-ink-3; }
    .sb-item.on { @apply s-selected text-ink-1; }
    .sb-item.on svg { @apply text-ink-1; }
    .page-title { @apply text-[20px] font-semibold text-ink-1; }
    .sgroup { @apply flex flex-col max-w-[600px]; }
    .srow { @apply flex items-center gap-3 px-[10px] min-h-12; }
    .srow > svg:first-child { @apply ico text-ink-3; }
    .srow > .ng { @apply w-[14px] flex-none; }
    .srow .txt { @apply flex-1 flex flex-col gap-0.5 min-w-0; }
    .srow .txt > b { @apply t-body text-ink-1; }
    .srow .txt > span { @apply t-meta text-ink-3 truncate; }
    .snote { @apply pl-9 pr-[10px] py-1 t-meta text-ink-3; }
    .sfrow { @apply flex items-center gap-2 pl-9 pr-[10px] py-1; }
    .sfield { @apply flex-1 h-7 px-3 rounded-[7px] s-hover t-body text-ink-1 outline-none placeholder:text-ink-3 focus:bg-white/10; }
    .expand { @apply flex items-center gap-1.5 pl-9 h-[30px] t-meta text-ink-3 hover:text-ink-2; }
    .ok-t { @apply t-label text-ok; } .warn-t { @apply t-label text-signal; } .err-t { @apply t-label text-live; } .dim-t { @apply t-label text-ink-3; }
    .toggle { @apply relative inline-block w-[30px] h-[18px] rounded-full bg-white/[.14] transition-colors flex-none; }
    .toggle::after { content: ''; @apply absolute top-[2px] left-[2px] w-[14px] h-[14px] rounded-full bg-ink-2 transition-all; }
    .toggle.on { @apply bg-ink-1; }
    .toggle.on::after { @apply left-[14px] bg-black; }
    .select { @apply inline-flex items-center gap-1.5 h-7 px-2.5 rounded-[7px] s-hover t-label text-ink-1 hover:bg-white/10 whitespace-nowrap; }
    .seg-ctl { @apply inline-flex gap-0.5 p-0.5 rounded-full s-faint; }
    .seg-ctl > span { @apply inline-flex items-center h-[26px] px-3 rounded-full t-label text-ink-3 hover:text-ink-2; }
    .seg-ctl > span.on { @apply s-selected text-ink-1; }
    .spin { @apply inline-block w-3 h-3 rounded-full border-[1.5px] border-white/20 border-t-white/80 animate-spin; }

    /* System UI: context menus, alerts, toast */
    .menu { @apply rounded-[8px] py-1 min-w-[190px] text-[13px] text-white/90 border border-white/10; background: rgba(40,40,44,.94); backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    .menu > div { @apply px-3 py-[3px] mx-1 rounded-[4px] hover:bg-[#2f6fe4]; }
    .menu > hr { @apply border-white/10 my-1; }
    .menu > div.off { @apply text-white/30 hover:bg-transparent; }
    .menu > div.red { @apply text-[#ff6961] hover:text-white; }
    .alert { @apply w-[260px] rounded-[12px] p-4 text-center border border-white/10; background: rgba(40,40,44,.97); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    .alert .a-t { @apply text-[13px] font-semibold mb-1; }
    .alert .a-m { @apply text-[11px] text-white/70 mb-4; }
    .alert .a-red { @apply h-7 rounded-md bg-[#ff453a] text-[13px] flex items-center justify-center hover:brightness-110; }
    .alert .a-def { @apply h-7 rounded-md bg-white/10 text-[13px] flex items-center justify-center hover:bg-white/15; }

    /* Right menu */
    .mi { @apply w-full text-left flex items-center gap-2 px-2.5 py-[5px] rounded-md text-[12.5px] text-white/60 hover:bg-white/5 hover:text-white/90; }
    .mi.on { @apply bg-white/10 text-white; }
    .mi.on-win { @apply bg-[#2f6fe4]/25 text-white; }
    .mg { @apply text-[11px] font-semibold text-white/35 px-2.5 pt-4 pb-1; }
  }
</style>
</head>

  <div class="picker ml-[36px] mb-2 inline-flex gap-0.5 p-0.5 rounded-full s-faint">
    <span class="pill" data-status="open"><svg class="ico-s"><use href="#m-open"/></svg>To do</span>
    <span class="pill" data-status="progress"><svg class="ico-s"><use href="#m-progress"/></svg>In progress</span>

    <span class="pill" data-status="done"><svg class="ico-s"><use href="#m-done"/></svg>Done</span>
  </div>
</template>

<script>
/* ═════════════════════════════════════════════════════════════════════
   STATES
   kind: 'notch' (c-* closed, o-* open) or 'win' (desktop / onboarding).
   tpl: template · keys: selected tab/sidebar item · open: where hover on the
   closed notch goes · closed: where the open notch returns · next: [state, ms]
   for flows · alert: alert template drawn over its base state (as).
   ═════════════════════════════════════════════════════════════════════ */
const S = {}, ORDER = [], GROUPS = []
let G = null
function group(name) { G = { name, ids: [] }; GROUPS.push(G) }
function st(id, label, o = {}) { S[id] = { id, label, ...o }; ORDER.push(id); G.ids.push(id); if (!o.kind) S[id].kind = 'notch' }

group('Closed notch')
st('c-idle', 'Idle', { tpl: 'tpl-closed', open: 'o-today', note: 'Nothing to say: exactly the hardware notch.' })
st('c-meeting-later', 'Meeting · later today', { tpl: 'tpl-closed', open: 'o-today', note: 'More than an hour away: start time and time left.' })
st('c-meeting-hour', 'Meeting · within the hour', { tpl: 'tpl-closed', open: 'o-today-hour', note: 'Minutes, counting down.' })
st('c-meeting-urgent', 'Meeting · urgent', { tpl: 'tpl-closed', open: 'o-today-urgent', note: '10 min or less: amber.' })
st('c-meeting-live', 'Meeting · in progress', { tpl: 'tpl-closed', open: 'o-today-live', note: 'Title and minutes left.' })
st('c-meeting-tomorrow', 'Meeting · tomorrow, in person', { tpl: 'tpl-closed', open: 'o-today', note: 'Place icon; day instead of minutes.' })
st('c-recording', 'Recording', { tpl: 'tpl-closed', open: 'o-recording', note: 'Red pulse, elapsed, level bars.' })
st('c-recording-micoff', 'Recording · mic off', { tpl: 'tpl-closed', open: 'o-recording-micoff', note: 'Meeting mic off for privacy.' })
st('c-recording-unknown', 'Recording · mic state unknown', { tpl: 'tpl-closed', open: 'o-recording-warnings', note: 'Amber mic-off.' })
st('c-dict-listening', 'Dictation · listening', { tpl: 'tpl-closed', open: 'o-today', next: ['c-dict-working', 2500], note: 'Holding Fn.' })
st('c-dict-working', 'Dictation · transcribing', { tpl: 'tpl-closed', open: 'o-today', next: ['c-dict-inserted', 2200], note: 'Transcribing › refining › inserting.' })
st('c-dict-inserted', 'Dictation · inserted', { tpl: 'tpl-closed', open: 'o-today', next: ['c-meeting-later', 1800] })
st('c-dict-failed', 'Dictation · failed', { tpl: 'tpl-closed', open: 'o-today', note: 'Short reason: Copied · Downloading · Needs access · No speech · Failed.' })
st('c-proc-saving', 'Processing · saving', { tpl: 'tpl-closed', open: 'o-proc-saving', next: ['c-proc-uploading', 1500] })
st('c-proc-uploading', 'Processing · uploading', { tpl: 'tpl-closed', open: 'o-proc-uploading', next: ['c-proc-transcribing', 3000] })
st('c-proc-transcribing', 'Processing · transcribing', { tpl: 'tpl-closed', open: 'o-proc-transcribing', next: ['c-proc-summarizing', 2500] })
st('c-proc-summarizing', 'Processing · summarizing', { tpl: 'tpl-closed', open: 'o-proc-summarizing', next: ['c-ready', 2500] })
st('c-ready', 'Result · ready', { tpl: 'tpl-closed', open: 'o-ready' })
st('c-failed', 'Result · failed', { tpl: 'tpl-closed', open: 'o-failed' })
st('c-focus', 'Focused task', { tpl: 'tpl-closed', open: 'o-tasks' })
st('c-tasks', 'Open tasks', { tpl: 'tpl-closed', open: 'o-tasks', note: 'No meeting: task count.' })

const T = { tpl: 'tpl-today', keys: ['today'] }
group('Today')
st('o-today', 'Today', { ...T, closed: 'c-meeting-later', note: 'Focus, Today, Later. Click opens the link; right-click for more.' })
st('o-today-hour', 'Focus · within the hour', { ...T, closed: 'c-meeting-hour' })
st('o-today-urgent', 'Focus · urgent', { ...T, closed: 'c-meeting-urgent' })
st('o-today-live', 'Focus · in progress', { ...T, closed: 'c-meeting-live' })
st('o-today-meet-waiting', 'Google Meet · waiting for tab', { ...T, closed: 'c-meeting-live' })
st('o-today-meet-unavailable', 'Google Meet · bridge unavailable', { ...T, closed: 'c-meeting-live' })
st('o-today-empty-connect', 'Empty · connect calendar', { ...T, closed: 'c-idle' })
st('o-today-empty-allow', 'Empty · allow access', { ...T, closed: 'c-idle' })
st('o-today-empty-waiting', 'Empty · waiting for access', { ...T, closed: 'c-idle' })
st('o-today-empty-failed', 'Empty · couldn’t refresh', { ...T, closed: 'c-idle' })
st('o-today-empty-off', 'Empty · calendar off', { ...T, closed: 'c-idle' })
st('o-today-empty-reading', 'Empty · reading calendars', { ...T, closed: 'c-idle' })
st('o-today-empty-nocal', 'Empty · no calendars', { ...T, closed: 'c-idle' })
st('o-today-empty-nothing', 'Empty · nothing else today', { ...T, closed: 'c-idle' })

group('Prompts')
st('o-prompt-offer', 'Meeting detected · Zoom', { ...T, closed: 'c-meeting-live', note: 'Opens on its own when a call starts.' })
st('o-prompt-offer-meet', 'Meeting detected · Google Meet', { ...T, closed: 'c-meeting-live' })
st('o-prompt-ended', 'Meeting may have ended', { ...T, closed: 'c-recording' })
st('o-prompt-autostop', 'Meeting ended · auto-stop', { ...T, closed: 'c-recording', next: ['o-proc-saving', 12000], note: 'Countdown; stops on its own at 0.' })

const R = { tpl: 'tpl-recording', keys: ['today'] }
group('Recording')
st('o-recording', 'Recording', { ...R, closed: 'c-recording', note: 'Stop processes it; right-click Stop deletes.' })
st('o-recording-micoff', 'Recording · mic off', { ...R, closed: 'c-recording-micoff' })
st('o-recording-warnings', 'Recording · warnings', { ...R, closed: 'c-recording-unknown' })
st('a-delete-recording', 'Alert · delete recording', { kind: 'notch', alert: 'al-delete-recording', as: 'o-recording' })

const P = { tpl: 'tpl-proc', keys: ['today'] }
group('Processing and result')
st('o-proc-saving', 'Saving audio', { ...P, closed: 'c-proc-saving', next: ['o-proc-uploading', 1500] })
st('o-proc-uploading', 'Uploading', { ...P, closed: 'c-proc-uploading', next: ['o-proc-transcribing', 3000] })
st('o-proc-transcribing', 'Transcribing', { ...P, closed: 'c-proc-transcribing', next: ['o-proc-summarizing', 2500] })
st('o-proc-summarizing', 'Summarizing', { ...P, closed: 'c-proc-summarizing', next: ['o-ready', 2500] })
st('o-ready', 'Ready', { ...P, closed: 'c-ready' })
st('o-failed', 'Failed', { ...P, closed: 'c-failed', note: 'One recovery action: Allow · Open System Settings · Try again · Check storage · Check connection · Update API key · Close.' })
st('o-failed-permission', 'Failed · permission', { ...P, closed: 'c-failed' })
st('o-stopped', 'Stopped', { ...P, closed: 'c-idle' })
st('a-stop-processing', 'Alert · stop processing', { kind: 'notch', alert: 'al-stop-processing', as: 'o-proc-transcribing' })

const H = { tpl: 'tpl-history', keys: ['today'] }
group('Recordings')
st('o-history', 'Recordings', { ...H, closed: 'c-meeting-later', note: 'By day. State only when it needs attention.' })
st('o-history-recovery', 'Recordings · recovered', { ...H, closed: 'c-meeting-later' })
st('o-history-empty', 'Recordings · empty', { ...H, closed: 'c-meeting-later' })
st('a-delete-meeting', 'Alert · delete meeting', { kind: 'notch', alert: 'al-delete-meeting', as: 'o-history' })

const D = { tpl: 'tpl-detail', keys: [] }
group('Meeting detail')
st('o-detail', 'Detail', { ...D, closed: 'c-meeting-later', note: '+ adds an action item to Tasks; timestamps play from there.' })
st('o-detail-summaryfailed', 'Detail · summary failed', { ...D, closed: 'c-meeting-later' })
st('o-detail-failed', 'Detail · transcription failed', { ...D, closed: 'c-meeting-later' })
st('o-detail-queued', 'Detail · queued', { ...D, closed: 'c-meeting-later' })
st('o-detail-preparing', 'Detail · preparing', { ...D, closed: 'c-proc-transcribing' })
st('o-detail-unreadable', 'Detail · unreadable transcript', { ...D, closed: 'c-meeting-later' })
st('o-detail-rename', 'Sheet · rename speaker', { kind: 'notch', alert: 'al-rename', as: 'o-detail' })

const K = { tpl: 'tpl-tasks', keys: ['tasks'] }
group('Tasks')
st('o-tasks', 'Tasks', { ...K, closed: 'c-tasks', note: 'Type and press Return. Try “Call mom tomorrow 3pm every week !!”. Click a mark for status, a title for the card.' })
st('o-tasks-typing', 'Input · values recognised', { ...K, closed: 'c-tasks', prefill: 'Call mom tomorrow 3pm every week !!' })
st('o-tasks-quickpick', 'Input · quick picks', { ...K, closed: 'c-tasks', prefill: 'Buy coffee beans' })
st('o-tasks-completion', 'Input · inline completion', { ...K, closed: 'c-tasks', prefill: 'Wri', note: 'Tab accepts.' })
st('o-tasks-picker', 'Status picker', { ...K, closed: 'c-tasks', onEnter: 'picker' })
st('o-tasks-card', 'Task card', { ...K, closed: 'c-tasks', onEnter: 'card' })
st('o-tasks-empty', 'Tasks · empty', { ...K, closed: 'c-idle' })
st('o-tasks-local', 'Tasks · on this Mac', { ...K, closed: 'c-tasks', note: 'Reminders not connected; click the label to connect.' })
st('o-tasks-finished', 'Finished', { ...K, closed: 'c-tasks' })

const $ = s => document.querySelector(s)
const stage = $('#stage'), nwrap = $('#nwrap'), notch = $('#notch'), nc = $('#nc'), winEl = $('#win'), alertEl = $('#alert')
const cur = { notch: 'c-meeting-later', win: null }
const alertBase = {}
let enteredAt = Date.now(), interactive = false, flowTimer = null, pinned = false, hoverIn = false, entered = false
let openT = null, leaveT = null, recStart = null

function matches(list, id) {
  return list.split(/\s+/).some(p => p.endsWith('*') ? id.startsWith(p.slice(0, -1)) : p === id)
}

function build(tplId, id, keys) {
  const wrap = document.createElement('div')
  wrap.appendChild(document.getElementById(tplId).content.cloneNode(true))
  let inc
  while ((inc = wrap.querySelector('[data-include]'))) inc.replaceWith(document.getElementById(inc.dataset.include).content.cloneNode(true))
  wrap.querySelectorAll('[data-only]').forEach(el => { if (!matches(el.dataset.only, id)) el.remove() })
  wrap.querySelectorAll('[data-not]').forEach(el => { if (matches(el.dataset.not, id)) el.remove() })
  wrap.querySelectorAll('[data-key]').forEach(el => el.classList.toggle('on', keys.includes(el.dataset.key)))
  return wrap
}

function decorate(root, base) {
  root.querySelectorAll('.seg[data-cells]').forEach(el => {
    el.innerHTML = '<i></i>'.repeat(+el.dataset.cells)
    paintSeg(el)
  })
  root.querySelectorAll('.bars[data-bars]').forEach(el => { el.innerHTML = '<i style="height:5px"></i>'.repeat(+el.dataset.bars) })
  root.querySelectorAll('[data-pin]').forEach(el => {
    el.className = pinned ? 'btn-iconf' : 'btn-icon'
    el.querySelector('svg').style.transform = pinned ? 'none' : 'rotate(30deg)'
    el.title = pinned ? 'Unpin panel' : 'Keep panel open'
  })
  root.querySelectorAll('[data-taskinput]').forEach(input => wireTaskInput(input, base))
  root.querySelectorAll('[data-search]').forEach(wireSearch)
  if (base.onEnter === 'picker') { const row = root.querySelectorAll('.task-row')[2]; row && togglePicker(row) }
  if (base.onEnter === 'card') { const row = root.querySelector('.task-row'); row && openCard(row) }
  tick()
}

function render() {
  // Notch
  const ns = S[cur.notch]
  const nbase = ns.alert ? S[alertBase[ns.id] || ns.as] : ns
  const closed = nbase.tpl === 'tpl-closed'
  const node = build(nbase.tpl, nbase.id, nbase.keys || [])
  nc.style.transition = 'none'; nc.style.opacity = 0
  nc.className = closed ? 'closed' : 'open'
  const inner = document.createElement('div'); inner.id = 'nci'
  inner.append(...node.childNodes)
  nc.replaceChildren(inner)
  decorate(nc, nbase)
  nwrap.classList.toggle('open', !closed)
  fitNotch()
  ro.disconnect(); ro.observe(inner)
  requestAnimationFrame(() => { nc.style.transition = ''; setTimeout(() => { nc.style.opacity = 1 }, closed ? 90 : 140) })

  // Window
  if (cur.win) {
    const ws = S[cur.win]
    const wbase = ws.alert ? S[alertBase[ws.id] || ws.as] : ws
    const wnode = build(wbase.tpl, wbase.id, wbase.keys || [])
    winEl.replaceChildren(...wnode.childNodes)
    decorate(winEl, wbase)
    winEl.hidden = false
    fitWin(); wro.disconnect(); wro.observe(winEl.firstElementChild)
  } else { winEl.hidden = true; winEl.replaceChildren() }

  // Alert / sheet
  const al = (cur.win && S[cur.win].alert) || ns.alert
  if (al) { alertEl.replaceChildren(document.getElementById(al).content.cloneNode(true)); alertEl.hidden = false; alertEl.querySelector('[autofocus]')?.focus() }
  else { alertEl.hidden = true; alertEl.replaceChildren() }

  // Caption + menu
  const ws = cur.win ? S[cur.win] : null
  $('#caption').innerHTML = `<div class="text-[11px] text-white/40">${groupOf(ns.id)}</div><div class="text-[13px] text-white/85 font-medium">${ns.label}</div>${ns.note ? `<div class="text-[11.5px] text-white/45 mt-0.5">${ns.note}</div>` : ''}${ws ? `<div class="text-[11px] text-white/40 mt-2">Window · ${groupOf(ws.id)}</div><div class="text-[12.5px] text-white/75">${ws.label}</div>${ws.note ? `<div class="text-[11.5px] text-white/45">${ws.note}</div>` : ''}` : ''}`
  document.querySelectorAll('#mlist .mi').forEach(b => {
    b.classList.toggle('on', b.dataset.state === cur.notch)
    b.classList.toggle('on-win', b.dataset.state === cur.win)
  })
  const active = document.querySelector(`#mlist .mi[data-state="${cur.win && interactiveWin ? cur.win : cur.notch}"]`)
  if (rendered) active?.scrollIntoView({ block: 'nearest' })
  rendered = true
}
let interactiveWin = false, rendered = false

// The notch follows its content: it grows and shrinks as the content changes.
const ro = new ResizeObserver(() => fitNotch())
function fitNotch() {
  const inner = document.getElementById('nci'); if (!inner) return
  const closed = nc.classList.contains('closed')
  const cap = stage.clientHeight - 40
  if (closed) { nc.style.maxHeight = ''; notch.style.width = inner.offsetWidth + 'px'; notch.style.height = '32px'; return }
  nc.style.maxHeight = cap + 'px'
  notch.style.width = '466px'
  notch.style.height = Math.min(inner.offsetHeight + 52, cap) + 'px'
}

const wro = new ResizeObserver(() => fitWin())
function fitWin() {
  const el = winEl.firstElementChild; if (!el) return
  const sw = stage.clientWidth - 60, sh = stage.clientHeight - 90
  const scale = Math.min(1, sw / el.offsetWidth, sh / el.offsetHeight)
  winEl.style.transform = `translateX(-50%) scale(${scale})`
}

function groupOf(id) { return (GROUPS.find(g => g.ids.includes(id)) || {}).name || '' }

function go(id, inter = false) {
  if (id === 'back') { id = backTo.pop() || 'o-today'; inter = true }
  const s = S[id]; if (!s) return
  if (s.alert) { alertBase[id] = s.kind === 'win' ? cur.win : cur.notch; backTo.push(s.kind === 'win' ? cur.win : cur.notch); if (!S[alertBase[id]] || S[alertBase[id]].kind !== s.kind) alertBase[id] = s.as }
  clearTimeout(flowTimer)
  interactive = inter
  if (s.kind === 'win') {
    cur.win = id; interactiveWin = true
    const n = S[cur.notch]   // a window takes focus: the open notch closes (unless pinned)
    if (!pinned && !n.alert && n.tpl !== 'tpl-closed') cur.notch = n.closed || 'c-idle'
    else if (n.alert) cur.notch = 'c-meeting-later'
  }
  else { cur.notch = id; entered = hoverIn; interactiveWin = false }
  enteredAt = Date.now()
  const isRec = x => x && /recording|prompt-ended|prompt-autostop/.test(x) && !x.startsWith('a-delete') && !x.startsWith('s-')
  if (isRec(cur.notch) || cur.win === 'd-meetings-recording') { if (!recStart) recStart = Date.now() } else recStart = null
  if (inter && s.next && $('#optFlow').checked) flowTimer = setTimeout(() => go(s.next[0], true), s.next[1])
  history.replaceState(null, '', '#' + cur.notch + (cur.win ? '+' + cur.win : ''))
  render()
}
const backTo = []

/* Live values: timers, countdowns, upload progress, levels */
function paintSeg(el) {
  const n = el.children.length
  let f = el.dataset.fill
  if (f === 'live') f = el._lv = Math.max(.05, Math.min(1, (el._lv || .4) + (Math.random() - .5) * .25))
  else if (f === 'upload') f = interactive ? Math.min(1, (Date.now() - enteredAt) / 3000) : .45
  else f = +f
  ;[...el.children].forEach((c, i) => { const v = Math.max(0, Math.min(1, f * n - i)); c.classList.toggle('f', v > 0); c.style.opacity = v > 0 && v < 1 ? (.3 + .7 * v) : '' })
}
function fmt(t) { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}` }
function tick() {
  const since = recStart ? (Date.now() - recStart) / 1000 : 0
  document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = fmt(+el.dataset.elapsed + since) })
  document.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = Math.max(0, +el.dataset.countdown - Math.floor((Date.now() - enteredAt) / 1000)) + ' s' })
  document.querySelectorAll('[data-upload]').forEach(el => { const p = interactive ? Math.min(1, (Date.now() - enteredAt) / 3000) : .6; el.style.background = `linear-gradient(90deg,#f2f2f2 ${p * 100}%,rgba(255,255,255,.09) ${p * 100}%)` })
}
setInterval(tick, 1000)
setInterval(() => {
  document.querySelectorAll('.seg[data-fill="live"], .seg[data-fill="upload"]').forEach(paintSeg)
  document.querySelectorAll('.bars[data-bars]').forEach(el => {
    const quiet = el.hasAttribute('data-quiet');
    [...el.children].forEach((b, i) => { const shape = [.55, .85, 1, .8, .5][i % 5]; b.style.height = Math.max(3, 14 * shape * (quiet ? .3 : (.35 + Math.random() * .65))) + 'px' })
  })
  if (playing) { const f = document.querySelector('[data-pfill]'); if (f) { playPos = Math.min(1, playPos + .002); f.style.width = playPos * 100 + '%'; const t = document.querySelector('[data-ptime]'); if (t) t.textContent = fmt(playPos * 2892) } }
}, 120)
let playing = false, playPos = .25

/* Notch hover: open on enter, close on leave (unless pinned) */
nwrap.addEventListener('mouseenter', () => {
  hoverIn = true; entered = true; clearTimeout(leaveT)
  const s = S[cur.notch]
  if (S[s.alert ? s.as : s.id].tpl === 'tpl-closed' && !s.alert) openT = setTimeout(() => go(s.open || 'o-today', true), 140)
})
nwrap.addEventListener('mouseleave', () => {
  hoverIn = false; clearTimeout(openT)
  const s = S[cur.notch]
  if (s.tpl && s.tpl !== 'tpl-closed' && !s.alert && !pinned && $('#optAuto').checked && entered) {
    leaveT = setTimeout(() => {
      if (hoverIn || !$('#ctx').hidden || nc.contains(document.activeElement) && document.activeElement.tagName === 'INPUT' && document.activeElement.value) return
      go(s.closed || 'c-idle', true)
    }, 380)
  }
})
nwrap.addEventListener('click', e => { const s = S[cur.notch]; if (s.tpl === 'tpl-closed') { clearTimeout(openT); go(s.open || 'o-today', true) } })

/* Clicks */
document.addEventListener('click', e => {
  const t = e.target
  const inCtx = t.closest('#ctx')
  if (!inCtx) hideCtx()
  const statusMenu = t.closest('[data-status-menu]')
  if (statusMenu) { setStatus(ctxTarget, statusMenu.dataset.statusMenu); hideCtx(); return }
  const opt = t.closest('[data-opt]')
  if (opt) { const sel = ctxTarget; if (opt.dataset.go) go(opt.dataset.go, true); else if (sel) sel.firstChild.textContent = opt.dataset.opt; hideCtx(); return }

  const close = t.closest('[data-close]'); if (close) { closeCard(close.closest('.task-card')); return }
  const status = t.closest('[data-status]')
  if (status) {
    const card = status.closest('.task-card'), picker = status.closest('.picker')
    if (card) { card._row && setStatus(card._row, status.dataset.status); syncCard(card); return }
    if (picker) { setStatus(picker._row, status.dataset.status); picker.remove(); return }
  }
  const mark = t.closest('[data-mark]'); if (mark) { togglePicker(mark.closest('.task-row')); return }
  const openEl = t.closest('[data-open]')
  if (openEl && !t.closest('[data-go]')) { openCard(openEl.closest('.task-row')); return }

  const menuBtn = t.closest('[data-menu-click]')
  if (menuBtn) { const r = menuBtn.getBoundingClientRect(); showCtx(menuBtn.dataset.menuClick, r.left, r.bottom + 4, menuBtn); e.stopPropagation(); return }
  const sel = t.closest('.select[data-options], .select[data-goopt]')
  if (sel) {
    const r = sel.getBoundingClientRect()
    const items = sel.dataset.options ? sel.dataset.options.split('|').map(o => `<div data-opt="${o}">${o}</div>`) : sel.dataset.goopt.split('|').map(p => { const [l, g] = p.split(':'); return `<div data-opt="${l}" data-go="${g}">${l}</div>` })
    showCtxHTML(`<div class="menu">${items.join('')}</div>`, r.left, r.bottom + 4, sel); return
  }
  const tg = t.closest('.toggle')
  if (tg && !tg.dataset.go) { tg.classList.toggle('on'); if (tg.dataset.action === 'all-cals') { const c = tg.closest('.sgroup').querySelector('[data-cals]'); c.hidden = tg.classList.contains('on') } return }
  const sc = t.closest('.seg-ctl > span'); if (sc) { [...sc.parentNode.children].forEach(x => x.classList.toggle('on', x === sc)); return }
  const ch = t.closest('.choice > button'); if (ch) { [...ch.parentNode.children].forEach(x => { x.className = x === ch ? 'btn-iconf w-auto px-3 t-label' : 'btn-ghost' }); return }

  const act = t.closest('[data-action]')
  if (act) { action(act.dataset.action, act); if (!act.dataset.go && !act.dataset.toast) return }
  const toastEl = t.closest('[data-toast]')
  if (toastEl && !t.closest('[data-go]')) toast(toastEl.dataset.toast)
  const goEl = t.closest('[data-go]')
  if (goEl) { if (goEl.dataset.toast) toast(goEl.dataset.toast); if (inCtx) hideCtx(); go(goEl.dataset.go, true) }
  else if (toastEl && inCtx) hideCtx()
})

document.addEventListener('contextmenu', e => {
  const m = e.target.closest('[data-menu]'), row = e.target.closest('.task-row')
  if (row && !m) { e.preventDefault(); showCtx('menu-task', e.clientX, e.clientY, row); return }
  if (m) { e.preventDefault(); showCtx(m.dataset.menu, e.clientX, e.clientY, m) }
})

let ctxTarget = null
function showCtx(id, x, y, target) { showCtxHTML(document.getElementById(id).innerHTML, x, y, target) }
function showCtxHTML(html, x, y, target) {
  const c = $('#ctx'); c.innerHTML = html; c.hidden = false; ctxTarget = target
  const r = c.getBoundingClientRect()
  c.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; c.style.top = Math.min(y, innerHeight - r.height - 8) + 'px'
}
function hideCtx() { $('#ctx').hidden = true }

function toast(text) { const el = $('#toast'); el.textContent = text; el.style.opacity = 1; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = 0, 1600) }

function action(name, el) {
  switch (name) {
    case 'pin': pinned = !pinned; document.querySelectorAll('[data-pin]').forEach(p => { p.className = pinned ? 'btn-iconf' : 'btn-icon'; p.querySelector('svg').style.transform = pinned ? 'none' : 'rotate(30deg)' }); break
    case 'open-window': go('d-meetings', true); break
    case 'close-window': cur.win = null; render(); break
    case 'finish-onboarding': cur.win = null; go('c-meeting-later', true); break
    case 'copied': el.classList.add('!text-ok'); setTimeout(() => el.classList.remove('!text-ok'), 1600); break
    case 'add-item': el.innerHTML = '<svg class="ico"><use href="#i-queue"/></svg>'; el.className = 'w-[18px] h-[18px] flex items-center justify-center text-ink-3'; el.title = 'In tasks'; el.removeAttribute('data-action'); toast('Added to Tasks'); break
    case 'play': playing = !playing; el.innerHTML = `<svg class="ico-s"><use href="#i-${playing ? 'pause' : 'play'}"/></svg>`; document.querySelector('[data-pfill]')?.classList.toggle('bg-ink-1', playing); break
    case 'grant': el.outerHTML = '<span class="ok-t">Connected</span>'; break
    case 'expand': { const box = el.nextElementSibling; box.hidden = !box.hidden; el.querySelector('svg').style.transform = box.hidden ? '' : 'rotate(180deg)'; break }
    case 'save': { const m = el.parentNode.querySelector('[data-savemsg]'); m.innerHTML = '<span class="spin"></span>'; setTimeout(() => m.textContent = 'Saved', 700); break }
    case 'dict-add': { const i = el.parentNode.querySelector('input'); const v = i.value.trim(); if (!v) break; v.split(',').map(x => x.trim()).filter(Boolean).forEach(w => { const c = el.closest('.sgroup').querySelector('.dchip').cloneNode(true); c.firstChild.textContent = w; el.closest('.sgroup').querySelector('[data-dict]').appendChild(c) }); i.value = ''; break }
    case 'dict-remove': el.remove(); break
  }
}

/* Tasks: picker, card, status */
const MARK = { open: 'm-open', progress: 'm-progress', blocked: 'm-blocked', done: 'm-done' }
function setStatus(row, status) {
  if (!row) return
  const m = row.querySelector('[data-mark]'); m.dataset.mark = status; m.querySelector('use').setAttribute('href', '#' + MARK[status])
  const title = row.querySelector('[data-title]'); title.classList.toggle('text-ink-3', status === 'done')
  const doneGroup = row.closest('[data-group]')?.parentNode.querySelector('[data-group="done"]')
  if (status === 'done' && doneGroup && row.closest('[data-group]') !== doneGroup) doneGroup.appendChild(row)
  if (status !== 'done' && row.closest('[data-group="done"]')) row.closest('[data-group]').parentNode.querySelector('[data-group="today"]').appendChild(row)
}
function togglePicker(row) {
  const open = row.querySelector('.picker'); document.querySelectorAll('.picker').forEach(p => { p.remove() }); document.querySelectorAll('.task-row.s-hover').forEach(r => r.classList.remove('s-hover', 'rounded-[9px]'))
  if (open) return
  const p = document.getElementById('tpl-picker').content.firstElementChild.cloneNode(true); p._row = row
  p.querySelectorAll('[data-status]').forEach(x => x.classList.toggle('on', x.dataset.status === row.querySelector('[data-mark]').dataset.mark))
  row.appendChild(p); row.classList.add('s-hover', 'rounded-[9px]')
}
function openCard(row) {
  document.querySelectorAll('.task-card').forEach(closeCard)
  const card = document.getElementById('tpl-task-card').content.firstElementChild.cloneNode(true)
  card._row = row
  card.querySelector('[data-cardtitle]').textContent = row.querySelector('[data-title]').textContent
  syncCard(card)
  row.hidden = true; row.after(card)
}
function syncCard(card) {
  const st = card._row.querySelector('[data-mark]').dataset.mark
  card.querySelector('[data-cardmark] use').setAttribute('href', '#' + MARK[st])
  card.querySelectorAll('[data-cardstatus] [data-status]').forEach(x => x.classList.toggle('on', x.dataset.status === st))
}
function closeCard(card) { if (!card) return; const t = card.querySelector('[data-cardtitle]').textContent.trim(); if (t) card._row.querySelector('[data-title]').textContent = t; card._row.hidden = false; card.remove() }

/* Task input: live parsing, quick picks, inline completion */
const KNOWN = ['Write release notes', 'Water the plants', 'Weekly review', 'Call the bank', 'Reply to Deniz about pricing']
function parse(text) {
  const t = text.toLowerCase(), out = []
  const day = /\btoday\b/.test(t) ? 'Today' : /\btomorrow\b/.test(t) ? 'Tomorrow' : (t.match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/) || [])[1]
  const m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/) || t.match(/\b(\d{1,2}):(\d{2})\b/)
  let time = null
  if (m) { let h = +m[1]; if (m[3] === 'pm' && h < 12) h += 12; if (m[3] === 'am' && h === 12) h = 0; time = `${String(h).padStart(2, '0')}:${m[2] || '00'}` }
  if (day || time) out.push({ k: 'due', label: (day ? day[0].toUpperCase() + day.slice(1, 3 + (day.length > 3 ? day.length : 0)) : 'Today') + (time ? ' ' + time : ''), icon: 'calendar', tint: 'text-signal' })
  const r = t.match(/\bevery\s+(day|week|month|year|weekday|monday|tuesday|wednesday|thursday|friday)\b/) || t.match(/\b(daily|weekly|monthly)\b/)
  if (r) out.push({ k: 'rec', label: r[0].startsWith('every') ? 'Every ' + r[1] : r[1][0].toUpperCase() + r[1].slice(1), icon: 'history', tint: 'text-ink-2' })
  if (/!!/.test(text)) out.push({ k: 'pri', label: 'High', icon: 'bell', tint: 'text-signal' })
  else if (/(^|\s)!(\s|$)/.test(text)) out.push({ k: 'pri', label: 'Medium', icon: 'bell', tint: 'text-ink-2' })
  return out
}
function stripTokens(text) {
  return text.replace(/\b(today|tomorrow)\b/ig, '').replace(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/ig, '').replace(/\b\d{1,2}(:\d{2})?\s*(am|pm)\b/ig, '').replace(/\b\d{1,2}:\d{2}\b/g, '')
    .replace(/\bevery\s+\w+\b/ig, '').replace(/\b(daily|weekly|monthly)\b/ig, '').replace(/!+/g, '').replace(/\s+/g, ' ').trim()
}
function wireTaskInput(input, base) {
  const box = input.closest('.mb-3'), chips = box.querySelector('[data-chips]'), ghost = box.querySelector('[data-ghost]')
  let dismissed = new Set()
  const completion = () => { const v = input.value; if (v.length < 2) return ''; const k = KNOWN.find(x => x.toLowerCase().startsWith(v.toLowerCase()) && x.length > v.length); return k ? k.slice(v.length) : '' }
  const update = () => {
    const v = input.value
    if (!v) dismissed = new Set()
    const comp = completion()
    ghost.innerHTML = comp ? `<span class="invisible">${v.replace(/</g, '&lt;')}</span><span class="text-ink-4">${comp}</span>` : ''
    const found = parse(v).filter(x => !dismissed.has(x.k))
    chips.classList.toggle('pt-2', !!v.trim())
    if (!v.trim()) { chips.innerHTML = ''; return }
    chips.innerHTML = found.length
      ? found.map(x => `<button class="chip ${x.tint}" data-k="${x.k}" title="Click to drop"><svg class="ico-xs"><use href="#i-${x.icon}"/></svg>${x.label}</button>`).join('')
      : [['Today', 'calendar', 'today'], ['Tomorrow', 'calendar', 'tomorrow'], ['Priority', 'bell', '!!']].map(([l, i, tok]) => `<button class="chip-out" data-tok="${tok}"><svg class="ico-xs"><use href="#i-${i}"/></svg>${l}</button>`).join('')
  }
  chips.addEventListener('click', e => {
    const c = e.target.closest('[data-k]'); if (c) { dismissed.add(c.dataset.k); update(); input.focus(); e.stopPropagation(); return }
    const q = e.target.closest('[data-tok]'); if (q) { input.value = input.value.trim() + ' ' + q.dataset.tok; update(); input.focus(); e.stopPropagation() }
  })
  input.addEventListener('input', update)
  input.addEventListener('keydown', e => {
    if (e.key === 'Tab') { const c = completion(); if (c) { e.preventDefault(); input.value += c; update() } }
    if (e.key === 'Escape') { input.value = ''; update() }
    if (e.key === 'Enter' && input.value.trim()) {
      const found = parse(input.value).filter(x => !dismissed.has(x.k))
      const title = stripTokens(input.value) || input.value.trim()
      const due = found.find(x => x.k === 'due'), rec = found.find(x => x.k === 'rec'), pri = found.find(x => x.k === 'pri')
      const meta = (rec ? '<svg class="ico-xs text-ink-4"><use href="#i-history"/></svg>' : '') + (pri ? `<svg class="ico-xs ${pri.label === 'High' ? 'text-signal' : 'text-ink-3'}"><use href="#i-bell"/></svg>` : '') + (due && due.label !== 'Today' ? `<span class="t-meta text-ink-3">${due.label.replace(/^Today /, '')}</span>` : '')
      const row = document.createElement('div'); row.className = 'task-row'
      row.innerHTML = `<div class="row-38"><button data-mark="open"><svg class="ico"><use href="#m-open"/></svg></button><button data-open class="flex-1 min-w-0 flex items-center gap-2 text-left"><span class="t-body flex-1 truncate" data-title></span>${meta}</button></div>`
      row.querySelector('[data-title]').textContent = title
      const later = due && !/^Today/.test(due.label)
      const groupEl = (input.closest('#nc, #win') || document).querySelector(`[data-group="${later ? 'later' : 'today'}"]`)
      if (groupEl) { groupEl.querySelector('.group-h').after(row); row.animate([{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' }) }
      KNOWN.unshift(title); input.value = ''; update()
    }
  })
  if (base.prefill) { input.value = base.prefill; update(); setTimeout(() => { input.focus(); input.setSelectionRange(99, 99) }, 60) }
}

/* Desktop search */
function wireSearch(input) {
  const list = input.closest('[data-list]')
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase(); let any = false
    list.querySelectorAll('[data-title]').forEach(r => { const ok = !q || r.dataset.title.toLowerCase().includes(q); r.hidden = !ok; any ||= ok })
    list.querySelectorAll('[data-hdr]').forEach(h => h.hidden = !!q)
    const nr = list.querySelector('[data-noresults]'); nr.hidden = any || !q
  })
}

/* Right menu */
function buildMenu() {
  const nav = $('#mlist')
  let html = '<div class="mg">Flows</div>' + FLOWS.map((f, i) => `<button class="mi" data-flow="${i}"><svg class="w-2.5 h-2.5 text-white/50"><use href="#i-play"/></svg>${f[0]}</button>`).join('')
  for (const g of GROUPS) {
    html += `<div class="mg" data-g>${g.name}</div>` + g.ids.map(id => {
      const s = S[id]; const dot = s.kind === 'win' ? '▢' : (s.tpl === 'tpl-closed' ? '▬' : (s.alert ? '!' : '▼'))
      return `<button class="mi" data-state="${id}" data-label="${(g.name + ' ' + s.label).toLowerCase()}"><span class="w-3 text-center text-[9px] text-white/30">${dot}</span><span class="truncate">${s.label}</span></button>`
    }).join('')
  }
  nav.innerHTML = html
  nav.addEventListener('click', e => {
    const f = e.target.closest('[data-flow]'); if (f) { FLOWS[+f.dataset.flow][1](); return }
    const b = e.target.closest('[data-state]'); if (!b) return
    const s = S[b.dataset.state]
    if (s.kind === 'notch' && !s.alert && cur.win && !e.shiftKey) cur.win = null   // jumping to a notch state hides the window (shift keeps it)
    go(b.dataset.state, false)
  })
  $('#msearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    nav.querySelectorAll('[data-state]').forEach(b => b.hidden = q && !b.dataset.label.includes(q))
    nav.querySelectorAll('[data-flow]').forEach(b => b.hidden = !!q)
  })
}

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return
  if (e.key === ']' || e.key === '[') {
    const curId = interactiveWin && cur.win ? cur.win : cur.notch
    const i = ORDER.indexOf(curId), n = ORDER[(i + (e.key === ']' ? 1 : -1) + ORDER.length) % ORDER.length]
    if (S[n].kind === 'notch' && !S[n].alert) cur.win = null
    go(n, false)
  }
  if (e.key === 'Escape') { hideCtx(); if (!alertEl.hidden) go('back') }
})
addEventListener('resize', () => { fitWin(); render() })

buildMenu()
const [hn, hw] = decodeURIComponent(location.hash.slice(1)).split('+')
if (S[hn]) cur.notch = hn
if (S[hw]) cur.win = hw
render()
</script>
