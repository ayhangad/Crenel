<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crenel — prototype</title>
<!--
  Crenel: clickable prototype of the whole app. Design language and rules: docs/DESIGN.md.

  HOW IT WORKS
  - The left area is the Mac screen: menu bar, notch, and the desktop/onboarding window.
    Hover the notch to open it, move away to close it. The pin keeps it open.
  - The notch has three sizes: compact (two ears beside the camera), strip (ears plus one
    line under them, for prompts and live dictation) and open (the panel).
  - The menu on the right jumps to every screen and state. "Flows" plays a whole scenario.
  - [ and ] step through the states one by one.

  EDITING
  - Every screen is a <template id="tpl-…">. Inside a template:
      data-only="state-id other-id prefix*" → shown only in those states
      data-not="…"                          → hidden in those states
      data-go="state-id"                    → click goes to that state (prototype link)
      data-menu="menu-…"                    → right-click opens that menu
      data-toast="text"                     → click shows a short notice
      data-include="tpl-…"                  → pastes another template there
  - Instruments are drawn by the engine from data attributes:
      <span class="segd" data-seg="12:48" data-h="14" data-cells="2">  segment numerals
      <div class="gauge" data-gauge=".55" data-size="104">              tick sweep gauge
      <div class="ruler" data-span="8-20" data-now="10.7" data-events="14.5-15.25:focus|…">
      <div class="vu" data-cells="28">  ·  <span class="ladder">  ·  <div class="chart">
      data-fuse=".55" on a closed state → the notch's bottom edge becomes a progress fuse
  - The state list (name, note, which template, where hover goes) is in the STATES block.
  - Colours: tailwind.config. Shared components: the <style type="text/tailwindcss"> block.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui'] },
      colors: {
        // Backlit ink: a hair warm, like a lit instrument face. Never pure grey.
        ink: { 1: '#f3f1ec', 2: '#aaa7a1', 3: '#76736e', 4: '#4c4a47', 5: '#2e2d2b' },
        signal: '#ffad33', // amber — waiting for you
        live: '#ff5a47',   // red — live, error
        ok: '#5fe0b4',     // phosphor green — ready, connected
      },
    } },
  }
</script>
<style>
  @property --rt { syntax: '<length>'; inherits: true; initial-value: 6px; }
  @property --rb { syntax: '<length>'; inherits: true; initial-value: 10px; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: .18 } }
  @keyframes caret { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
  @keyframes scan { from { transform: translateX(-120%) } to { transform: translateX(520%) } }
  @keyframes enter { from { opacity: 0; transform: translateY(-5px) } to { opacity: 1; transform: none } }
  @keyframes lampon { 0% { filter: brightness(.2) } 40% { filter: brightness(2.2) } 100% { filter: none } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  .breathe { animation: breathe 1.8s ease-in-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #menu ::-webkit-scrollbar { width: 6px; }
  #menu ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
  .enter { animation: enter .32s cubic-bezier(.2,.8,.2,1) both; }
</style>
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-[#111112] text-ink-1 font-sans antialiased overflow-hidden; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum', 'ss01'; }
    button { @apply cursor-default; }
    [data-go], [data-toast], [data-action], [data-open], [data-mark], .select, .toggle { cursor: default; }
  }
  @layer components {
    /* ── Type: one family, sentence case, natural tracking. Large sizes tighten, never widen. */
    .t-hero { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -.012em; }
    .t-title { font-size: 15px; font-weight: 600; line-height: 1.25; letter-spacing: -.006em; }
    .t-body { font-size: 13px; font-weight: 500; line-height: 1.3; }
    .t-label { font-size: 12.5px; font-weight: 500; line-height: 1.3; }
    .t-meta { font-size: 11.5px; font-weight: 400; line-height: 1.3; color: theme('colors.ink.3'); }
    .t-micro { font-size: 10px; font-weight: 500; line-height: 1; color: theme('colors.ink.4'); }
    .t-read { font-size: 13px; line-height: 1.6; }
    .unit { font-size: 11px; font-weight: 500; line-height: 1; color: theme('colors.ink.3'); margin-left: 4px; }
    .ico { width: 16px; height: 16px; flex: none; }
    .ico-s { width: 14px; height: 14px; flex: none; }
    .ico-xs { width: 12px; height: 12px; flex: none; }

    /* ── Lit things glow a little; unlit instrument parts stay visible as ghosts (6–9%). */
    .glow { text-shadow: 0 0 10px color-mix(in srgb, currentColor 45%, transparent); }
    .segd { display: inline-block; line-height: 0; vertical-align: -.08em; }
    .segd svg { overflow: visible; filter: drop-shadow(0 0 3px color-mix(in srgb, currentColor 45%, transparent)); }
    .segd .g { opacity: .075; }
    .gauge svg { overflow: visible; }
    .gauge .on { filter: drop-shadow(0 0 2px color-mix(in srgb, currentColor 60%, transparent)); }
    .gauge .g { opacity: .13; }
    .bleed { position: relative; }
    .bleed::before { content: ''; position: absolute; inset: -30px; pointer-events: none; border-radius: 50%;
      background: radial-gradient(closest-side, color-mix(in srgb, currentColor 9%, transparent), transparent); }

    /* Lamps: the one way to show state. 8×4 telltale; dot for "live". */
    .lamp { @apply inline-block flex-none w-2 h-1 rounded-[2px]; background: rgba(255,255,255,.09); }
    .lamp.dot { @apply w-[7px] h-[7px] rounded-full; }
    .lamp.on-w { background: #f3f1ec; box-shadow: 0 0 6px rgba(243,241,236,.55); }
    .lamp.on-a { background: #ffad33; box-shadow: 0 0 7px rgba(255,173,51,.6); }
    .lamp.on-r { background: #ff5a47; box-shadow: 0 0 7px rgba(255,90,71,.65); }
    .lamp.on-g { background: #5fe0b4; box-shadow: 0 0 7px rgba(95,224,180,.55); }
    .lamp.on-d { background: #76736e; }
    .lamp.fire { animation: lampon .5s ease-out both; }
    .cells { @apply inline-flex gap-[3px] items-center; }
    .cells > i { @apply block w-[9px] h-1 rounded-[2px]; background: rgba(255,255,255,.09); transition: background .25s, box-shadow .25s; }
    .cells > i.on { background: #f3f1ec; box-shadow: 0 0 6px rgba(243,241,236,.45); }
    .cells > i.done { background: #76736e; }
    .cells > i.cur { background: #f3f1ec; box-shadow: 0 0 6px rgba(243,241,236,.5); animation: blink 1.1s steps(1) infinite; }
    .pri { @apply inline-flex items-end gap-[1.5px] h-[10px]; }
    .pri > i { @apply block w-[2px] rounded-[1px] bg-ink-5; }
    .pri > i:nth-child(1) { height: 4px } .pri > i:nth-child(2) { height: 7px } .pri > i:nth-child(3) { height: 10px }
    .pri > i.on { background: currentColor; }

    /* ── Rows. Text never moves; one hover slab slides between rows of a list. */
    .slide { position: relative; }
    .slab { position: absolute; left: 0; right: 0; top: 0; height: 0; border-radius: 10px; background: rgba(255,255,255,.055);
      opacity: 0; pointer-events: none; transition: transform .18s cubic-bezier(.2,.8,.2,1), height .18s, opacity .15s; z-index: 0; }
    .slide > :not(.slab), .slide .row, .slide .trow { position: relative; z-index: 1; }
    .row { @apply flex items-start gap-3 px-[10px] h-[50px] pt-[9px] rounded-[10px]; }
    .row-1 { @apply flex items-center gap-3 px-[10px] rounded-[10px] h-12; }
    .trow { @apply flex items-center gap-3 px-[10px] h-[38px] rounded-[10px]; }
    .trow > button[data-mark] { @apply flex-none w-4 h-4 flex items-center justify-center; }
    .tcol { @apply w-[42px] flex-none flex flex-col gap-[3px] text-right; }
    .tcol > b { @apply t-body text-ink-1; font-weight: 500; }
    .tcol > span { @apply t-meta; }
    .group-h { @apply flex items-baseline gap-2 px-[10px] h-[28px] pt-[6px] mb-0.5 t-label text-ink-3; }
    .group-h > .n { @apply text-ink-4; }
    .l1 { @apply flex items-baseline gap-2 min-w-0; }
    .l2 { @apply flex items-center gap-1.5 t-meta min-w-0; }
    .sep { @apply text-ink-4; }

    /* ── Buttons: one primary per surface, with its key. */
    .btn { @apply inline-flex items-center justify-center gap-1.5 h-7 px-3 rounded-[8px] t-label whitespace-nowrap transition-colors duration-150; }
    .btn.sm { @apply h-[26px] px-2.5; }
    .btn-primary { @apply btn bg-ink-1 text-black hover:bg-white active:bg-ink-2; }
    .btn-ghost { @apply btn text-ink-2 hover:text-ink-1 hover:bg-white/[.06] active:bg-white/[.1]; }
    .btn-quiet { @apply btn text-ink-1 bg-white/[.07] hover:bg-white/[.11]; }
    .btn-red { @apply btn text-live hover:bg-white/[.06]; }
    .btn-icon { @apply relative inline-flex items-center justify-center w-7 h-7 rounded-[8px] text-ink-3 hover:text-ink-1 hover:bg-white/[.06] transition-colors; }
    .btn-icon.on { @apply text-ink-1; }
    .btn-icon.on::after { content: ''; @apply absolute bottom-[1px] left-1/2 -translate-x-1/2 w-2 h-[2px] rounded-full bg-ink-1; box-shadow: 0 0 6px rgba(243,241,236,.6); }
    .kbd { @apply ml-0.5 text-[11px] font-medium opacity-50; }
    .dis { @apply opacity-40 pointer-events-none; }
    /* Push knobs: round, ringed, for the controls you press during a call. */
    .knob { @apply relative inline-flex items-center justify-center w-10 h-10 rounded-full text-ink-1 transition-colors;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.1), rgba(255,255,255,.035) 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.08); }
    .knob:hover { background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.15), rgba(255,255,255,.05) 70%); }
    .knob .lamp { @apply absolute -bottom-[9px] left-1/2 -translate-x-1/2; }
    .knob.sm { @apply w-8 h-8; }

    /* ── Tabs: words with a lamp under the live one; the lamp slides. */
    .tabs { @apply relative inline-flex items-center gap-4; }
    .tab { @apply inline-flex items-baseline gap-1 h-[30px] pt-[7px] t-label text-ink-3 transition-colors hover:text-ink-2; }
    .tab.on { @apply text-ink-1; }
    .tab .badge { @apply t-meta text-ink-4; }
    .tab.on .badge { @apply text-ink-3; }
    .tab-lamp { @apply absolute bottom-[1px] h-[2px] rounded-full bg-ink-1; box-shadow: 0 0 6px rgba(243,241,236,.6);
      transition: left .32s cubic-bezier(.3,1.25,.4,1), width .32s cubic-bezier(.3,1.25,.4,1); }
    .chip { @apply inline-flex items-center gap-[6px] h-[22px] pl-2 pr-2.5 rounded-[6px] t-meta text-ink-2 bg-white/[.06] hover:bg-white/[.09]; }
    .chip-out { @apply inline-flex items-center gap-[6px] h-[22px] px-2 rounded-[6px] t-meta text-ink-3 hover:text-ink-2 hover:bg-white/[.05]; }
    .pill { @apply inline-flex items-center gap-1.5 h-[26px] px-2.5 rounded-[7px] t-label text-ink-2 hover:bg-white/[.06]; }
    .pill.on { @apply bg-white/[.1] text-ink-1; }

    /* ── Meters. */
    .vu { @apply flex gap-[2px] flex-1 items-center; }
    .vu > i { @apply block flex-1 h-[7px] rounded-[1.5px]; background: rgba(255,255,255,.07); transition: background .08s; }
    .vu > i.red { background: rgba(255,90,71,.12); }
    .vu > i.on { background: #f3f1ec; }
    .vu > i.red.on { background: #ff5a47; box-shadow: 0 0 6px rgba(255,90,71,.6); }
    .vu > i.pk { background: #f3f1ec; box-shadow: 0 0 6px rgba(243,241,236,.7); }
    .vu.off > i { background: rgba(255,255,255,.05) !important; box-shadow: none !important; }
    .ladder { @apply inline-flex gap-[2px] items-end h-[14px]; }
    .ladder > b { @apply flex flex-col-reverse gap-[2px]; }
    .ladder > b > i { @apply block w-[3px] h-[2px] rounded-[1px]; background: rgba(255,255,255,.1); }
    .ladder > b > i.on { background: currentColor; box-shadow: 0 0 4px color-mix(in srgb, currentColor 50%, transparent); }
    .chart { @apply relative flex items-center gap-[2px] h-9 overflow-hidden; mask-image: linear-gradient(90deg, transparent, #000 18%, #000); }
    .chart > i { @apply block w-[2px] flex-none rounded-full bg-ink-3; transition: height .15s; }
    .chart > i:last-child { @apply bg-ink-1; }
    .scanner { @apply absolute inset-0 overflow-hidden pointer-events-none rounded-[inherit]; }
    .scanner::after { content: ''; position: absolute; top: 0; bottom: 0; width: 22%; animation: scan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate;
      background: linear-gradient(90deg, transparent, rgba(243,241,236,.16), transparent); }
    .track { @apply relative h-1 rounded-full; background: rgba(255,255,255,.08); }
    .track > i { @apply absolute inset-y-0 left-0 rounded-full bg-ink-1; box-shadow: 0 0 6px rgba(243,241,236,.5); }

    /* Day ruler: hours as a scale, events as lit blocks, now as a needle. */
    .ruler { @apply relative h-[46px] mx-[10px]; }
    .ruler .ev { @apply absolute top-[6px] h-[6px] rounded-[2px] bg-ink-3; }
    .ruler .ev.focus { @apply bg-ink-1; box-shadow: 0 0 6px rgba(243,241,236,.45); }
    .ruler .ev.amber { @apply bg-signal; box-shadow: 0 0 6px rgba(255,173,51,.5); }
    .ruler .ev.invite { background: transparent; box-shadow: inset 0 0 0 1px #ffad33; }
    .ruler .ev.dim { @apply bg-ink-4; }
    .ruler .tk { @apply absolute top-[20px] w-px h-[3px] bg-ink-4; }
    .ruler .tk.M { @apply h-[6px] bg-ink-3; }
    .ruler .tk.past { opacity: .45; }
    .ruler .lb { @apply absolute top-[31px] -translate-x-1/2 t-micro; }
    .ruler .now { @apply absolute top-[1px] w-px h-[26px] bg-signal; box-shadow: 0 0 6px rgba(255,173,51,.8); }
    .ruler .now::before { content: ''; @apply absolute -top-[1px] -left-[2.5px] w-[6px] h-[3px] rounded-[1px] bg-signal; }
    .ruler .past-mask { @apply absolute left-0 top-[4px] h-[10px]; background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,.5)); }

    /* ── Notch. */
    #nwrap { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 30; --rt: 6px; --rb: 10px; transition: --rt .45s, --rb .45s; }
    #nwrap.peek { --rt: 9px; --rb: 18px; }
    #nwrap.open { --rt: 14px; --rb: 24px; }
    #nwrap::before, #nwrap::after { content: ''; position: absolute; top: 0; width: var(--rt); height: var(--rt); }
    #nwrap::before { left: calc(-1 * var(--rt)); background: radial-gradient(circle at 0 100%, transparent calc(var(--rt) - .5px), #000 var(--rt)); }
    #nwrap::after { right: calc(-1 * var(--rt)); background: radial-gradient(circle at 100% 100%, transparent calc(var(--rt) - .5px), #000 var(--rt)); }
    #notch { position: relative; background: #000; overflow: hidden; border-radius: 0 0 var(--rb) var(--rb); width: 186px; height: 32px;
      transition: width .52s cubic-bezier(.3,1.16,.4,1), height .52s cubic-bezier(.3,1.16,.4,1); }
    #nc { position: absolute; top: 0; left: 50%; transform: translateX(-50%); transition: opacity .18s ease-out; }
    #nc.open { width: 480px; padding: 0 14px 16px; overflow-y: auto; }
    #nc.closed { width: max-content; }
    #fuse { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 2px; border-radius: 1px; width: 0; opacity: 0;
      background: var(--c, #f3f1ec); box-shadow: 0 0 8px var(--c, #f3f1ec), 0 0 2px var(--c, #f3f1ec); }
    .ears { display: grid; width: max-content; grid-template-columns: 1fr 186px 1fr; height: 32px; align-items: center; }
    .ears > .ear { @apply flex items-center gap-[7px] whitespace-nowrap t-label text-ink-2; }
    .ears > .ear.l { @apply justify-start pl-[14px] pr-2; }
    .ears > .ear.r { @apply justify-end pr-[14px] pl-2; }
    .ear-t { @apply max-w-[118px] truncate; }
    .peek { width: 440px; padding-bottom: 10px; }
    .peek > .ears { width: 100%; }
    .strip { @apply relative flex items-center gap-2.5 h-[38px] mx-2 pl-[10px] pr-1.5 rounded-[12px]; background: rgba(255,255,255,.055); }
    .strip .t-body { @apply text-ink-1; }
    .stream { @apply flex-1 min-w-0 flex justify-end overflow-hidden whitespace-nowrap t-body text-ink-1;
      mask-image: linear-gradient(90deg, transparent, #000 22%); }
    .caret { @apply inline-block w-[7px] h-[14px] ml-[3px] -mb-[2px] bg-ink-1 rounded-[1px]; animation: caret 1s steps(1) infinite; box-shadow: 0 0 6px rgba(243,241,236,.6); }
    .band { @apply sticky top-0 z-10 grid items-center h-8 -mx-[14px] mb-2 px-[14px] bg-black; grid-template-columns: 1fr 186px 1fr; }
    .band-r { @apply flex justify-end gap-0.5; }

    /* Today hero: one instrument, one sentence. */
    .hero { @apply relative flex items-center gap-4 pl-1.5 pr-[10px] pt-1 pb-3; }
    .gauge-box { @apply relative flex-none w-[104px] h-[104px]; }
    .gauge-c { @apply absolute inset-0 flex flex-col items-center justify-center gap-[5px] pt-1; }

    /* ── Windows. */
    .win { @apply relative rounded-[12px] overflow-hidden border border-white/10; background: #0e0e0d; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
    .lights { @apply absolute top-3.5 left-3.5 flex gap-2 z-10; }
    .lights > i { @apply block w-3 h-3 rounded-full bg-white/15; }
    .lights > i:first-child { @apply bg-[#ff5f57]; }
    .sidebar { @apply w-[212px] flex-none flex flex-col gap-6 px-3 pb-4; background: #090908; }
    .sb-item { @apply relative flex items-center gap-3 h-9 px-[10px] rounded-[10px] t-label text-ink-2 hover:bg-white/[.05] transition-colors; }
    .sb-item svg { @apply text-ink-3; }
    .sb-item.on { @apply bg-white/[.08] text-ink-1; }
    .sb-item.on svg { @apply text-ink-1; }
    .page-title { @apply text-[22px] font-semibold text-ink-1; letter-spacing: -.015em; }
    .sgroup { @apply flex flex-col max-w-[620px]; }
    .srow { @apply flex items-center gap-3 px-[10px] min-h-[50px]; }
    .srow > svg:first-child { @apply ico text-ink-3; }
    .srow > .ng { @apply w-4 flex-none; }
    .srow .txt { @apply flex-1 flex flex-col gap-0.5 min-w-0; }
    .srow .txt > b { @apply t-body text-ink-1; }
    .srow .txt > span { @apply t-meta truncate; }
    .snote { @apply pl-[38px] pr-[10px] py-1 t-meta; }
    .sfrow { @apply flex items-center gap-2 pl-[38px] pr-[10px] py-1; }
    .sfield { @apply flex-1 h-8 px-3 rounded-[8px] bg-white/[.055] t-body text-ink-1 outline-none placeholder:text-ink-3 focus:bg-white/[.09]; }
    .expand { @apply flex items-center gap-1.5 pl-[38px] h-[30px] t-meta hover:text-ink-2; }
    /* Status words carry their lamp. */
    .ok-t, .warn-t, .err-t, .dim-t { @apply inline-flex items-center gap-2 t-label text-ink-2; }
    .ok-t::before, .warn-t::before, .err-t::before, .dim-t::before { content: ''; @apply block w-2 h-1 rounded-[2px]; }
    .ok-t::before { background: #5fe0b4; box-shadow: 0 0 7px rgba(95,224,180,.55); }
    .warn-t::before { background: #ffad33; box-shadow: 0 0 7px rgba(255,173,51,.6); }
    .err-t::before { background: #ff5a47; box-shadow: 0 0 7px rgba(255,90,71,.6); }
    .dim-t::before { background: rgba(255,255,255,.12); }
    .dim-t { @apply text-ink-3; }
    /* Switch: a knob with a lamp in it. */
    .toggle { @apply relative inline-block w-8 h-[18px] rounded-full flex-none transition-colors; background: rgba(255,255,255,.1); }
    .toggle::after { content: ''; @apply absolute top-[2px] left-[2px] w-[14px] h-[14px] rounded-full bg-ink-2 transition-all duration-200; }
    .toggle::before { content: ''; @apply absolute top-[7px] left-[7px] w-1 h-1 rounded-full z-10 transition-all duration-200 opacity-0; background: #5fe0b4; box-shadow: 0 0 5px #5fe0b4; }
    .toggle.on { @apply bg-ink-1; }
    .toggle.on::after { @apply left-4 bg-black; }
    .toggle.on::before { @apply left-[21px] opacity-100; }
    .select { @apply inline-flex items-center gap-1.5 h-7 px-2.5 rounded-[8px] bg-white/[.055] t-label text-ink-1 hover:bg-white/[.09] whitespace-nowrap; }
    .seg-ctl { @apply inline-flex gap-0.5 p-0.5 rounded-[9px] bg-white/[.04]; }
    .seg-ctl > span { @apply inline-flex items-center h-[26px] px-3 rounded-[7px] t-label text-ink-3 hover:text-ink-2; }
    .seg-ctl > span.on { @apply bg-white/[.1] text-ink-1; }
    .spin { @apply inline-block w-3 h-3 rounded-full border-[1.5px] border-white/20 border-t-white/80 animate-spin; }

    /* ── System UI: context menus, alerts, toast. */
    .menu { @apply rounded-[8px] py-1 min-w-[190px] text-[13px] text-white/90 border border-white/10; background: rgba(40,40,44,.94); backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    .menu > div { @apply px-3 py-[3px] mx-1 rounded-[4px] hover:bg-[#2f6fe4]; }
    .menu > hr { @apply border-white/10 my-1; }
    .menu > div.off { @apply text-white/30 hover:bg-transparent; }
    .menu > div.red { @apply text-[#ff6961] hover:text-white; }
    .alert { @apply w-[260px] rounded-[12px] p-4 text-center border border-white/10; background: rgba(40,40,44,.97); box-shadow: 0 20px 60px rgba(0,0,0,.6); }

<script>
/* ═════════════════════════════════════════════════════════════════════
   STATES
   kind: 'notch' (c-* closed or strip, o-* open) or 'win' (desktop / onboarding).
   tpl: template · keys: selected tab/sidebar item · open: where hover on the
   closed notch goes · closed: where the open notch returns · next: [state, ms]
   for flows · alert: alert template drawn over its base state (as).
   ═════════════════════════════════════════════════════════════════════ */
const S = {}, ORDER = [], GROUPS = []
let G = null
function group(name) { G = { name, ids: [] }; GROUPS.push(G) }
function st(id, label, o = {}) { S[id] = { id, label, ...o }; ORDER.push(id); G.ids.push(id); if (!o.kind) S[id].kind = 'notch' }

const C = { tpl: 'tpl-closed' }
group('Compact notch')
st('c-idle', 'Idle', { ...C, open: 'o-today', note: 'Nothing to say: exactly the hardware notch.' })
st('c-meeting-later', 'Meeting · later today', { ...C, open: 'o-today', note: 'What on the left, when on the right — start time in segment numerals.' })
st('c-meeting-hour', 'Meeting · within the hour', { ...C, open: 'o-today-hour', note: 'Minutes left. The bottom edge of the notch is a fuse: its length is the minutes left out of 60.' })
st('c-meeting-urgent', 'Meeting · 10 min or less', { ...C, open: 'o-today-urgent', next: ['c-meeting-now', 5000], note: 'Amber. The fuse rescales to the last 10 minutes so it visibly burns.' })
st('c-meeting-live', 'Meeting · in progress', { ...C, open: 'o-today-live', note: 'Lamp, title, minutes left; the fuse is the meeting’s remaining share.' })
st('c-meeting-tomorrow', 'Meeting · tomorrow', { ...C, open: 'o-today', note: 'Day word in ink-3, time in dimmer segments.' })
st('c-recording', 'Recording', { ...C, open: 'o-recording', next: ['c-prompt-ended', 8000], note: 'Red lamp + elapsed; right ear is a 6-column level ladder.' })
st('c-recording-micoff', 'Recording · mic off', { ...C, open: 'o-recording-micoff' })
st('c-recording-unknown', 'Recording · mic state unknown', { ...C, open: 'o-recording-warnings', note: 'Amber mic-off.' })
st('c-proc-saving', 'Processing · saving', { ...C, open: 'o-proc-saving', next: ['c-proc-uploading', 1500], note: 'Step word left; four station cells right, the live one blinks.' })
st('c-proc-uploading', 'Processing · uploading', { ...C, open: 'o-proc-uploading', next: ['c-proc-transcribing', 3000] })
st('c-proc-transcribing', 'Processing · transcribing', { ...C, open: 'o-proc-transcribing', next: ['c-proc-summarizing', 2500] })
st('c-proc-summarizing', 'Processing · writing notes', { ...C, open: 'o-proc-summarizing', next: ['c-ready', 2500] })
st('c-focus', 'Task in progress', { ...C, open: 'o-tasks', note: 'Minutes spent on the task you are doing.' })
st('c-tasks', 'Open tasks', { ...C, open: 'o-tasks', note: 'No meeting: open task count for today.' })

group('Strip notch')
st('c-meeting-now', 'Meeting · starting now', { ...C, open: 'o-today-urgent', note: 'The notch drops one line: Join with ↩. Never opens the panel by itself.' })
st('c-prompt-offer', 'Call detected · Zoom', { ...C, open: 'o-today-live', note: 'A call started: record it? ↩ records, Esc dismisses. The strip stays until you answer or the call ends.' })
st('c-prompt-offer-meet', 'Call detected · Google Meet', { ...C, open: 'o-today-live' })
st('c-prompt-ended', 'Call may have ended', { ...C, open: 'o-recording' })
st('c-prompt-autostop', 'Call ended · auto-stop', { ...C, open: 'o-recording', next: ['c-proc-saving', 12000], note: 'Red fuse burns for 12 s, then the recording stops on its own.' })

/* ═════════════════════════════════════════════════════════════════════
   INSTRUMENTS — drawn from data attributes; the Swift port mirrors these as Shapes.
   ═════════════════════════════════════════════════════════════════════ */
// Segment numerals: 10×18 cell, hexagonal segments, 7° italic, every digit sits on a ghost 8.
const SEGS = (() => {
  const g = .55
  const H = (x1, x2, y) => `${x1},${y} ${x1 + 1},${y - 1} ${x2 - 1},${y - 1} ${x2},${y} ${x2 - 1},${y + 1} ${x1 + 1},${y + 1}`
  const V = (x, y1, y2) => `${x},${y1} ${x + 1},${y1 + 1} ${x + 1},${y2 - 1} ${x},${y2} ${x - 1},${y2 - 1} ${x - 1},${y1 + 1}`
  return { a: H(1 + g, 9 - g, 1), b: V(9, 1 + g, 9 - g), c: V(9, 9 + g, 17 - g), d: H(1 + g, 9 - g, 17), e: V(1, 9 + g, 17 - g), f: V(1, 1 + g, 9 - g), g: H(1 + g, 9 - g, 9) }
})()
const SEGMAP = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' }
function drawSeg(el, text) {
  text = String(text ?? el.dataset.seg)
  const cells = +el.dataset.cells || 0
  if (cells && text.length < cells) text = ' '.repeat(cells - text.length) + text
  const h = +el.dataset.h || 14
  let x = 0, out = ''
  for (const ch of text) {
    if (ch === ':' || ch === '.') {
      const dots = ch === ':' ? [5.5, 12.5] : [16.5]
      out += dots.map(y => `<rect x="${x + 1}" y="${y - 1}" width="2" height="2" rx=".4"/>`).join('')
      x += 5; continue
    }
    const on = SEGMAP[ch] ?? ''
    for (const k in SEGS) out += `<polygon points="${SEGS[k]}" transform="translate(${x} 0)" class="${on.includes(k) ? 'on' : 'g'}"/>`
    x += 13
  }
  const w = x - 3 + 2.6
  el.innerHTML = `<svg viewBox="0 0 ${w} 18" height="${h}" width="${(w / 18 * h).toFixed(1)}" fill="currentColor"><g transform="translate(2.2 0) skewX(-7)">${out}</g></svg>`
  el._seg = text
}
// Sweep gauge: one tick per unit, 270°, major ticks longer. Lit ticks = value.
function drawGauge(el, v) {
  v = v ?? +el.dataset.gauge
  const n = +el.dataset.ticks || 60, size = +el.dataset.size || 104, sweep = 270, maj = +el.dataset.major || 0, c = size / 2, r = c - 1.5
  const lit = Math.round(v * n)
  let s = ''
  for (let i = 0; i < n; i++) {
    const a = (-sweep / 2 + sweep * i / (n - 1)) * Math.PI / 180, major = maj && i % maj === 0, len = major ? size * .085 : size * .05
    const x1 = c + Math.sin(a) * (r - len), y1 = c - Math.cos(a) * (r - len), x2 = c + Math.sin(a) * r, y2 = c - Math.cos(a) * r
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke-width="${major ? 1.7 : 1.25}" class="${i < lit ? 'on' : 'g'}"/>`
  }
  el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" stroke="currentColor" stroke-linecap="round">${s}</svg>`
}
// Ignition: sweep to full and settle back to the value (only when the panel opens).
function ignite(el, loop) {
  const target = +el.dataset.gauge, t0 = performance.now(), up = 420, down = 520
  const step = now => {
    if (!document.body.contains(el)) return
    const t = now - t0
    const v = t < up ? easeOut(t / up) : t < up + down ? 1 - (1 - target) * easeOut((t - up) / down) : target
    drawGauge(el, loop ? (t < up ? easeOut(t / up) : 1) : v)
    if (t < up + down) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
const easeOut = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3)
// Day ruler.
function drawRuler(el) {
  const [a, b] = el.dataset.span.split('-').map(Number), now = +el.dataset.now
  const pct = t => ((t - a) / (b - a) * 100).toFixed(3)
  let html = ''
  ;(el.dataset.events || '').split('|').filter(Boolean).forEach(e => {
    const [rng, kind = ''] = e.split(':'), [s, f] = rng.split('-').map(Number)
    html += `<i class="ev ${kind}" style="left:${pct(s)}%;width:calc(${pct(f) - pct(s)}% - 2px)"></i>`
  })
  for (let t = a; t <= b + 1e-6; t += .5) {
    const M = Number.isInteger(t)
    html += `<i class="tk ${M ? 'M' : ''} ${t < now ? 'past' : ''}" style="left:${pct(t)}%"></i>`
    if (M && t % 2 === 0 && t > a && t < b) html += `<span class="lb" style="left:${pct(t)}%">${String(t).padStart(2, '0')}</span>`
  }
  html += `<i class="past-mask" style="width:${pct(now)}%"></i><i class="now" style="left:${pct(now)}%"></i>`
  el.innerHTML = html
}
// Waveform overview for the player (deterministic).
function drawWave(el) {
  let seed = 7, html = ''
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280
  for (let i = 0; i < 110; i++) { const h = 3 + Math.pow(rnd(), 1.6) * 22 * (0.55 + 0.45 * Math.sin(i / 9) ** 2); html += `<i class="block flex-1 rounded-full" style="height:${h.toFixed(1)}px"></i>` }
  el.innerHTML = html; paintWave()
}
function paintWave() {
  document.querySelectorAll('[data-wave]').forEach(w => [...w.children].forEach((b, i, all) => { b.style.background = i / all.length < playPos ? '#f3f1ec' : '#4c4a47' }))
  document.querySelectorAll('[data-head]').forEach(h => h.style.left = playPos * 100 + '%')
  document.querySelectorAll('[data-ptime]').forEach(t => t.textContent = fmt(playPos * 2892))
}

/* ═════════════════════════════════════════════════════════════════════
   ENGINE
   ═════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s)
const stage = $('#stage'), nwrap = $('#nwrap'), notch = $('#notch'), nc = $('#nc'), winEl = $('#win'), alertEl = $('#alert'), fuseEl = $('#fuse')
const cur = { notch: 'c-meeting-later', win: null }
const alertBase = {}
let enteredAt = Date.now(), interactive = false, flowTimer = null, pinned = false, hoverIn = false, entered = false
let openT = null, leaveT = null, recStart = null, lastOpen = false, lampX = {}

function matches(list, id) {
  return list.split(/\s+/).some(p => p.endsWith('*') ? id.startsWith(p.slice(0, -1)) : p === id)
}

function build(tplId, id, keys) {
  const wrap = document.createElement('div')
  wrap.appendChild(document.getElementById(tplId).content.cloneNode(true))
  let inc
  while ((inc = wrap.querySelector('[data-include]'))) inc.replaceWith(document.getElementById(inc.dataset.include).content.cloneNode(true))
  wrap.querySelectorAll('[data-only]').forEach(el => { if (!matches(el.dataset.only, id)) el.remove() })
  wrap.querySelectorAll('[data-not]').forEach(el => { if (matches(el.dataset.not, id)) el.remove() })
  wrap.querySelectorAll('[data-key]').forEach(el => el.classList.toggle('on', keys.includes(el.dataset.key)))
  return wrap
}

function decorate(root, base, opts = {}) {
  root.querySelectorAll('.segd[data-seg]').forEach(el => drawSeg(el))
  root.querySelectorAll('.gauge[data-gauge]').forEach(el => { drawGauge(el, opts.ignite || el.dataset.ignite ? 0 : undefined); if (opts.ignite || el.dataset.ignite) ignite(el, el.dataset.ignite === 'loop') })
  root.querySelectorAll('.ruler[data-span]').forEach(drawRuler)
  root.querySelectorAll('[data-wave]').forEach(drawWave)
  root.querySelectorAll('.vu[data-cells]').forEach(el => { const n = +el.dataset.cells; el.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i >= n - Math.round(n * .14) ? 'red' : ''}"></i>`).join(''); el._lv = opts.ignite ? 1 : .4; el._pk = 0 })
  root.querySelectorAll('.ladder[data-ladder]').forEach(el => { el.innerHTML = '<b><i></i><i></i><i></i><i></i></b>'.repeat(+el.dataset.ladder) })
  root.querySelectorAll('[data-chart]').forEach(el => { el.innerHTML = Array.from({ length: 120 }, () => `<i style="height:${(2 + Math.random() * 20).toFixed(1)}px"></i>`).join('') })
  root.querySelectorAll('[data-stream]').forEach(el => {
    const words = el.dataset.stream.split(' '); let i = 0
    const t = setInterval(() => { if (!document.body.contains(el) || i >= words.length) return clearInterval(t); el.textContent += (i ? ' ' : '') + words[i++] }, 150)
  })
  root.querySelectorAll('[data-pin]').forEach(el => {
    el.classList.toggle('on', pinned)
    el.querySelector('svg').style.transform = pinned ? 'none' : 'rotate(30deg)'
    el.title = pinned ? 'Unpin panel' : 'Keep panel open'
  })
  root.querySelectorAll('[data-tabs]').forEach(placeLamp)
  root.querySelectorAll('[data-slide]').forEach(box => { box.classList.add('slide'); if (!box.querySelector(':scope > .slab')) box.insertAdjacentHTML('afterbegin', '<i class="slab"></i>') })
  if (opts.stagger) root.querySelectorAll('[data-stagger] > *').forEach((el, i) => { el.classList.add('enter'); el.style.animationDelay = (40 + i * 28) + 'ms' })
  if (base.id === 'ob-turning') root.querySelectorAll('[data-ign]').forEach((l, i) => setTimeout(() => l.classList.add('on-g', 'fire'), 350 + i * 420))
  root.querySelectorAll('[data-taskinput]').forEach(input => wireTaskInput(input, base))
  root.querySelectorAll('[data-search]').forEach(wireSearch)
  if (base.onEnter === 'picker') { const row = root.querySelectorAll('.task-row')[2]; row && togglePicker(row) }
  if (base.onEnter === 'card') { const row = root.querySelector('.task-row'); row && openCard(row) }
  tick()
}

// The tab lamp slides from where it was to the selected tab.
function placeLamp(tabs) {
  const lamp = tabs.querySelector('.tab-lamp'), on = tabs.querySelector('.tab.on')
  const key = tabs.closest('#win') ? 'win' : 'notch'
  if (!lamp) return
  if (!on) { lamp.style.opacity = 0; return }
  requestAnimationFrame(() => {
    const x = on.offsetLeft, w = on.querySelector('.badge') ? on.offsetWidth - on.querySelector('.badge').offsetWidth - 4 : on.offsetWidth
    const from = lampX[key]
    lamp.style.transition = 'none'
    lamp.style.left = (from ? from.x : x) + 'px'; lamp.style.width = (from ? from.w : w) + 'px'
    lamp.offsetWidth
    lamp.style.transition = ''
    lamp.style.left = x + 'px'; lamp.style.width = w + 'px'
    lampX[key] = { x, w }
  })
}

function render() {
  // Notch
  const ns = S[cur.notch]
  const nbase = ns.alert ? S[alertBase[ns.id] || ns.as] : ns
  const closed = nbase.tpl === 'tpl-closed'
  const node = build(nbase.tpl, nbase.id, nbase.keys || [])
  nc.style.transition = 'none'; nc.style.opacity = 0
  nc.className = closed ? 'closed' : 'open'
  const inner = document.createElement('div'); inner.id = 'nci'
  inner.append(...node.childNodes)
  nc.replaceChildren(inner)
  const opening = !closed && !lastOpen
  decorate(nc, nbase, { ignite: opening, stagger: !closed && (opening || nbase.tpl !== lastTpl) })
  if (!closed && nbase.tpl === lastTpl) nc.scrollTop = lastScroll
  const isPeek = closed && !!inner.querySelector('.peek')
  nwrap.classList.toggle('open', !closed)
  nwrap.classList.toggle('peek', isPeek)
  lastOpen = !closed; lastTpl = nbase.tpl
  fitNotch(); setFuse(closed ? inner.querySelector('[data-fuse]') : null)
  ro.disconnect(); ro.observe(inner)
  requestAnimationFrame(() => { nc.style.transition = ''; setTimeout(() => { nc.style.opacity = 1 }, closed ? 110 : 120) })

  // Window
  if (cur.win) {
    const ws = S[cur.win]
    const wbase = ws.alert ? S[alertBase[ws.id] || ws.as] : ws
    const wnode = build(wbase.tpl, wbase.id, wbase.keys || [])
    winEl.replaceChildren(...wnode.childNodes)
    decorate(winEl, wbase, { ignite: lastWinTpl !== wbase.tpl })
    lastWinTpl = wbase.tpl
    winEl.hidden = false
    fitWin(); wro.disconnect(); wro.observe(winEl.firstElementChild)
  } else { winEl.hidden = true; winEl.replaceChildren(); lastWinTpl = null }

  // Alert / sheet
  const al = (cur.win && S[cur.win].alert) || ns.alert

      const meta = (pri ? priHTML(pri.pri, pri.pri === 3 ? 'text-signal' : 'text-ink-2') : '') + (rec ? '<svg class="ico-xs text-ink-4"><use href="#i-repeat"/></svg>' : '') + (due && due.label !== 'Today' ? `<span class="t-meta${/^Today/.test(due.label) ? ' text-ink-2' : ''}">${due.label.replace(/^Today /, '').replace(/^Tomorrow/, 'Wed')}</span>` : '')
      const row = document.createElement('div'); row.className = 'task-row'
      row.innerHTML = `<div class="trow"><button data-mark="open"><svg class="ico"><use href="#m-open"/></svg></button><button data-open class="flex-1 min-w-0 flex items-center gap-2.5 text-left"><span class="t-body flex-1 truncate" data-title></span>${meta}</button></div>`
      row.querySelector('[data-title]').textContent = title
      const later = due && !/^Today/.test(due.label)
      const groupEl = (input.closest('#nc, #win') || document).querySelector(`[data-group="${later ? 'later' : 'today'}"]`)
      if (groupEl) {
        groupEl.querySelector('.group-h').after(row)
        row.animate([{ opacity: 0, transform: 'translateY(-10px)', filter: 'brightness(2)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' })
        if (!later) { const cells = groupEl.querySelector('.cells'); cells && cells.insertAdjacentHTML('beforeend', '<i></i>') }
      }
      KNOWN.unshift(title); input.value = ''; update()
    }
  })
  if (base.prefill) { input.value = base.prefill; update(); setTimeout(() => { input.focus(); input.setSelectionRange(99, 99) }, 60) }
}

/* Desktop search */
function wireSearch(input) {
  const list = input.closest('[data-list]')
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase(); let any = false
    list.querySelectorAll('[data-title]').forEach(r => { const ok = !q || r.dataset.title.toLowerCase().includes(q); r.hidden = !ok; any ||= ok })
    list.querySelectorAll('[data-hdr]').forEach(h => h.hidden = !!q)
    const nr = list.querySelector('[data-noresults]'); nr.hidden = any || !q
  })
}

/* Right menu */
function buildMenu() {
  const nav = $('#mlist')
  let html = '<div class="mg">Flows</div>' + FLOWS.map((f, i) => `<button class="mi" data-flow="${i}"><svg class="w-2.5 h-2.5 text-white/50"><use href="#i-play"/></svg>${f[0]}</button>`).join('')
  for (const g of GROUPS) {
    html += `<div class="mg" data-g>${g.name}</div>` + g.ids.map(id => {
      const s = S[id]; const dot = s.kind === 'win' ? '▢' : (s.tpl === 'tpl-closed' ? (g.name.startsWith('Strip') ? '▭' : '▬') : (s.alert ? '!' : '▼'))
      return `<button class="mi" data-state="${id}" data-label="${(g.name + ' ' + s.label).toLowerCase()}"><span class="w-3 text-center text-[9px] text-white/30">${dot}</span><span class="truncate">${s.label}</span></button>`
    }).join('')
  }
  nav.innerHTML = html
  nav.addEventListener('click', e => {
    const f = e.target.closest('[data-flow]'); if (f) { FLOWS[+f.dataset.flow][1](); return }
    const b = e.target.closest('[data-state]'); if (!b) return
    const s = S[b.dataset.state]
    if (s.kind === 'notch' && !s.alert && cur.win && !e.shiftKey) cur.win = null   // jumping to a notch state hides the window (shift keeps it)
    go(b.dataset.state, false)
  })
  $('#msearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase()
    nav.querySelectorAll('[data-state]').forEach(b => b.hidden = q && !b.dataset.label.includes(q))
    nav.querySelectorAll('[data-flow]').forEach(b => b.hidden = !!q)
  })
}

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return
  if (e.key === ']' || e.key === '[') {
    const curId = interactiveWin && cur.win ? cur.win : cur.notch
    const i = ORDER.indexOf(curId), n = ORDER[(i + (e.key === ']' ? 1 : -1) + ORDER.length) % ORDER.length]
    if (S[n].kind === 'notch' && !S[n].alert) cur.win = null
    go(n, false)
  }
  if (e.key === 'Escape') { hideCtx(); if (!alertEl.hidden) go('back') }
})
addEventListener('resize', () => { fitWin(); render() })

buildMenu()
const [hn, hw] = decodeURIComponent(location.hash.slice(1)).split('+')
if (S[hn]) cur.notch = hn
if (S[hw]) cur.win = hw
render()
</script>
</body>
