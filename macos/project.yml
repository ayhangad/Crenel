name: Crenel

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 26.0
    SWIFT_VERSION: 5.0
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  CrenelBrowserAudioHost:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CrenelBrowserAudioHost
      - path: Crenel/Services/BrowserAudio/BrowserAudioProtocol.swift
      - path: Crenel/Services/BrowserAudio/BrowserAudioSocketTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.Crenel.BrowserAudioHost
        PRODUCT_NAME: CrenelBrowserAudioHost
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  Crenel:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Crenel
        excludes:
          - Info.plist
          - "**/*.md"
    info:
      path: Crenel/Info.plist
      properties:
        CFBundleDisplayName: Crenel
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMicrophoneUsageDescription: Crenel uses the microphone for dictation and meeting recording.
        NSAudioCaptureUsageDescription: Crenel captures system audio to record the other side of your meetings.
        NSCalendarsUsageDescription: Crenel shows your upcoming meetings and events in the notch.
        NSCalendarsFullAccessUsageDescription: Crenel shows your upcoming meetings and events in the notch.
        NSRemindersUsageDescription: Crenel keeps your tasks in Apple Reminders so they sync across your devices.
        NSRemindersFullAccessUsageDescription: Crenel keeps your tasks in Apple Reminders so they sync across your devices.
        NSSpeechRecognitionUsageDescription: Crenel transcribes your dictation on this Mac.
        SUFeedURL: https://ayhangad.github.io/Crenel/appcast.xml
        SUPublicEDKey: D+TpR15F20jV5kLgiS2GKnKEItB6icPnz7WbIm8Nu9M=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.Crenel
        PRODUCT_NAME: Crenel
        PRODUCT_MODULE_NAME: Crenel
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Crenel/Crenel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Crenel/Crenel-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CrenelBrowserAudioHost
        link: false
        embed: false
      - package: Sparkle
    postBuildScripts:
      - name: Embed browser audio native host
        basedOnDependencyAnalysis: false
        script: |
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          mkdir -p "${destination}"
          cp "${BUILT_PRODUCTS_DIR}/CrenelBrowserAudioHost" "${destination}/CrenelBrowserAudioHost"

  CrenelTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CrenelTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.CrenelTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Crenel.app/Contents/MacOS/Crenel
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: Crenel

schemes:
  CrenelBrowserAudioHost:
    build:
      targets:
        CrenelBrowserAudioHost: all
    run:
      config: Debug

  Crenel:
    build:
      targets:
        Crenel: all
        CrenelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CrenelTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
