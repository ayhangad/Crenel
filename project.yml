name: MeetingNotch

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    from: 1.1.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.4
    SWIFT_VERSION: 5.0
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  MeetingNotchBrowserAudioHost:
    type: tool
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: MeetingNotchBrowserAudioHost
      - path: MeetingNotch/Services/BrowserAudio/BrowserAudioProtocol.swift
      - path: MeetingNotch/Services/BrowserAudio/BrowserAudioSocketTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.MeetingNotch.BrowserAudioHost
        PRODUCT_NAME: MeetingNotchBrowserAudioHost
        DEVELOPMENT_TEAM: 37G38FM2D2
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  MeetingNotch:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: MeetingNotch
        excludes:
          - Info.plist
    info:
      path: MeetingNotch/Info.plist
      properties:
        CFBundleDisplayName: MeetingNotch
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMicrophoneUsageDescription: MeetingNotch toplantılarda sesinizi kaydetmek için mikrofon erişimi kullanır.
        NSAudioCaptureUsageDescription: MeetingNotch toplantının sistem sesini kaydetmek için ses yakalama erişimi kullanır.
        NSCalendarsUsageDescription: MeetingNotch yaklaşan çevrim içi toplantıları göstermek için takvim erişimi kullanır.
        NSCalendarsFullAccessUsageDescription: MeetingNotch yaklaşan çevrim içi toplantıları göstermek için takvim erişimi kullanır.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.MeetingNotch
        PRODUCT_NAME: MeetingNotch
        DEVELOPMENT_TEAM: 37G38FM2D2
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MeetingNotch/MeetingNotch.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: MeetingNotch/MeetingNotch-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: DynamicNotchKit
      - target: MeetingNotchBrowserAudioHost
        link: false
        embed: false
    postBuildScripts:
      - name: Embed browser audio native host
        basedOnDependencyAnalysis: false
        script: |
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          mkdir -p "${destination}"
          cp "${BUILT_PRODUCTS_DIR}/MeetingNotchBrowserAudioHost" "${destination}/MeetingNotchBrowserAudioHost"

  MeetingNotchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: MeetingNotchTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gad.MeetingNotchTests
        DEVELOPMENT_TEAM: 37G38FM2D2
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: MeetingNotch

schemes:
  MeetingNotchBrowserAudioHost:
    build:
      targets:
        MeetingNotchBrowserAudioHost: all
    run:
      config: Debug

  MeetingNotch:
    build:
      targets:
        MeetingNotch: all
        MeetingNotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MeetingNotchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
